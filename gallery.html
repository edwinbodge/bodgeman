<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gallery | Bodgeman Cards</title>
<link rel="stylesheet" href="css/style.css" />
<script defer src="js/main.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="logo">Bodgeman</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="lawsuit.html">Lawsuit</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="mobile-menu" id="mobile-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="lawsuit.html">Lawsuit</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="gallery-page">
            <h1>The Complete Collection</h1>
            <p class="gallery-sub" id="gallery-count">Every card we've ever regretted.</p>
            <div class="card-grid" id="card-grid"></div>
            <noscript><p class="gallery-sub">The gallery needs JavaScript. Sorry. Not really.</p></noscript>
        </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Card viewer">
        <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
        <button class="lb-prev" id="lb-prev" aria-label="Previous card">&lsaquo;</button>
        <img id="lb-img" class="no-fade" alt="Bodgeman greeting card">
        <button class="lb-next" id="lb-next" aria-label="Next card">&rsaquo;</button>
    </div>

    <footer class="site-footer">
        <p>&copy; 2024 Bodgeman Cards</p>
    </footer>
</body>
</html>
