name: Add new cards

# Manual only: go to the Actions tab -> "Add new cards" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-cards
  cancel-in-progress: false

jobs:
  add-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Download new images from Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: python scripts/sync_drive.py

      - name: Optimise images and update the card list
        run: python scripts/process_cards.py

      - name: Commit and publish
        run: |
          git config user.name "Bodgeman Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add new cards"
            git push
          fi
