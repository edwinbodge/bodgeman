name: Add new cards

# Runs when:
#  * images are pushed into inbox/ (e.g. uploaded through the GitHub website)
#  * every 6 hours, to pick up anything dropped in the shared Google Drive folder
#  * someone clicks "Run workflow" on the Actions tab (publish right now)
on:
  push:
    branches: [main]
    paths: ['inbox/**']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-cards
  cancel-in-progress: false

jobs:
  add-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Download new images from Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: python scripts/sync_drive.py

      - name: Optimise images and update the card list
        run: python scripts/process_cards.py

      - name: Commit and publish
        run: |
          git config user.name "Bodgeman Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add new cards"
            git push
          fi
